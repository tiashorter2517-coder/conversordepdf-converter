# This folder (converter/) is published as its own PUBLIC repository (AGPL-3.0 requirement).
# Builds the conversion container, tests every converter on real files, then deploys
# the Worker + Container to Cloudflare. Docker is not needed on your PC.
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: converter-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t conversordepdf-converter container
      - name: Smoke test all converters
        run: bash container/smoke-test.sh conversordepdf-converter

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Deploy Worker + Container
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
